name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publish-and-deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-backend
      cancel-in-progress: false
    env:
      REGISTRY_NAME: ${{ vars.ACR_NAME }}
      REGISTRY_HOST: ${{ vars.ACR_LOGIN_SERVER }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish images
        run: |
          az acr login --name "$REGISTRY_NAME"

          docker build \
            -f src/Imposter.Words.Api/Dockerfile \
            -t "$REGISTRY_HOST/imposter-words:$GITHUB_SHA" .
          docker push "$REGISTRY_HOST/imposter-words:$GITHUB_SHA"

          docker build \
            -f src/Imposter.Game.Api/Dockerfile \
            -t "$REGISTRY_HOST/imposter-game:$GITHUB_SHA" .
          docker push "$REGISTRY_HOST/imposter-game:$GITHUB_SHA"

      - name: Deploy backend revisions
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          az extension add --name containerapp --upgrade --yes

          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name imposter-words \
            --image "$REGISTRY_HOST/imposter-words:$GITHUB_SHA" \
            --output none

          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name imposter-game \
            --image "$REGISTRY_HOST/imposter-game:$GITHUB_SHA" \
            --output none
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      TEST_GAMES_CONNECTION: "Host=127.0.0.1;Port=5432;Database=imposter_test;Username=imposter;Password=imposter_dev"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: imposter_test
          POSTGRES_USER: imposter
          POSTGRES_PASSWORD: imposter_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imposter -d imposter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/imposter-web/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore Imposter.slnx

      - name: Build backend
        run: dotnet build Imposter.slnx --configuration Release --no-restore

      - name: Test backend and PostgreSQL integration
        run: dotnet test Imposter.slnx --configuration Release --no-build --no-restore

      - name: Restore frontend dependencies
        working-directory: src/imposter-web
        run: npm ci

      - name: Test frontend
        working-directory: src/imposter-web
        run: npm test

      - name: Build frontend
        working-directory: src/imposter-web
        run: npm run build
